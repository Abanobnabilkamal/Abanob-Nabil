<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background: #0b1120; border-radius: 12px; display: block;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)" />
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle grid -->
  <rect width="800" height="480" fill="url(#bg-grad)" rx="12" />
  <g stroke="rgba(56, 189, 248, 0.06)" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
  </g>

  <!-- Window Header Bar (Streamlit App Simulation) -->
  <rect x="0" y="0" width="800" height="42" fill="rgba(15, 23, 42, 0.95)" rx="12" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />
  <rect x="220" y="11" width="360" height="20" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="400" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">localhost:8501 • Streamlit ML Dashboard</text>

  <!-- Left Sidebar (Inputs & Controls) -->
  <rect x="20" y="60" width="210" height="395" rx="10" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
  <text x="36" y="90" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">INPUT PARAMETERS</text>
  
  <text x="36" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">Square Footage (sq ft)</text>
  <rect x="36" y="128" width="178" height="24" rx="4" fill="rgba(0,0,0,0.3)" stroke="rgba(56,189,248,0.3)" />
  <text x="46" y="144" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">2,450 sq ft</text>

  <text x="36" y="175" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">Bedrooms / Bathrooms</text>
  <rect x="36" y="183" width="84" height="24" rx="4" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" />
  <text x="46" y="199" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">4 Beds</text>
  <rect x="130" y="183" width="84" height="24" rx="4" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" />
  <text x="140" y="199" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">3.5 Baths</text>

  <text x="36" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">Active Model</text>
  <rect x="36" y="238" width="178" height="26" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
  <text x="46" y="255" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="bold">XGBoost Regressor</text>

  <rect x="36" y="285" width="178" height="32" rx="6" fill="#2563eb" />
  <text x="125" y="305" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Run Prediction</text>

  <!-- Prediction Result Card on Sidebar -->
  <rect x="36" y="335" width="178" height="100" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56,189,248,0.3)" stroke-dasharray="3 3" />
  <text x="125" y="358" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">ESTIMATED VALUE</text>
  <text x="125" y="388" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">$485,200</text>
  <text x="125" y="412" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">Confidence: 94.2% (R² 0.89)</text>

  <!-- Main View Area (Charts & Analytics) -->
  <!-- Top KPI Cards -->
  <g transform="translate(245, 60)">
    <rect width="168" height="75" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
    <text x="16" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">Ridge Regression</text>
    <text x="16" y="52" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="bold">R² 0.84</text>
    <text x="16" y="66" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9">Baseline Linear Model</text>

    <rect x="180" width="168" height="75" rx="8" fill="url(#card-grad)" stroke="rgba(56,189,248,0.4)" />
    <text x="196" y="25" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">XGBoost Regressor</text>
    <text x="196" y="52" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="bold">R² 0.89 ★</text>
    <text x="196" y="66" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9">+5.9% Precision Lift</text>

    <rect x="360" width="170" height="75" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
    <text x="376" y="25" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">XGBoost Classifier</text>
    <text x="376" y="52" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="bold">92.4% Acc</text>
    <text x="376" y="66" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9">Price Tier Classification</text>
  </g>

  <!-- Big Visualization Chart (Regression Fit & Residuals) -->
  <g transform="translate(245, 150)">
    <rect width="345" height="200" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
    <text x="16" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">Actual vs. Predicted Price Curve</text>
    <text x="250" y="25" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10">● XGBoost Curve</text>

    <!-- Axes -->
    <line x1="35" y1="170" x2="320" y2="170" stroke="#334155" stroke-width="1" />
    <line x1="35" y1="40" x2="35" y2="170" stroke="#334155" stroke-width="1" />
    <text x="30" y="45" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" text-anchor="end">$800k</text>
    <text x="30" y="105" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" text-anchor="end">$400k</text>
    <text x="30" y="168" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" text-anchor="end">$0</text>
    <text x="320" y="182" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" text-anchor="end">Living Area (sq ft)</text>

    <!-- Grid lines -->
    <line x1="35" y1="105" x2="320" y2="105" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Trend line -->
    <path d="M 45 160 Q 140 120, 210 85 T 310 50" fill="none" stroke="url(#accent-line)" stroke-width="3" filter="url(#glow)" />

    <!-- Scatter dots -->
    <circle cx="55" cy="155" r="3" fill="#38bdf8" opacity="0.7" />
    <circle cx="75" cy="148" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="95" cy="138" r="3" fill="#818cf8" opacity="0.8" />
    <circle cx="110" cy="142" r="3" fill="#38bdf8" opacity="0.5" />
    <circle cx="130" cy="122" r="3" fill="#38bdf8" opacity="0.9" />
    <circle cx="155" cy="110" r="3" fill="#818cf8" opacity="0.7" />
    <circle cx="175" cy="102" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="195" cy="90" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="220" cy="82" r="3" fill="#c084fc" opacity="0.9" />
    <circle cx="245" cy="72" r="3" fill="#38bdf8" opacity="0.7" />
    <circle cx="270" cy="64" r="3" fill="#818cf8" opacity="0.6" />
    <circle cx="290" cy="56" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="305" cy="48" r="3" fill="#38bdf8" opacity="0.9" />
  </g>

  <!-- Feature Importance Card -->
  <g transform="translate(605, 150)">
    <rect width="170" height="200" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="bold">Feature Importance</text>

    <!-- Bars -->
    <text x="14" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9">Overall Quality</text>
    <rect x="14" y="62" width="140" height="8" rx="4" fill="#1e293b" />
    <rect x="14" y="62" width="125" height="8" rx="4" fill="#38bdf8" />

    <text x="14" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9">GrLivArea</text>
    <rect x="14" y="97" width="140" height="8" rx="4" fill="#1e293b" />
    <rect x="14" y="97" width="102" height="8" rx="4" fill="#60a5fa" />

    <text x="14" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9">TotalBsmtSF</text>
    <rect x="14" y="132" width="140" height="8" rx="4" fill="#1e293b" />
    <rect x="14" y="132" width="82" height="8" rx="4" fill="#818cf8" />

    <text x="14" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9">GarageCars</text>
    <rect x="14" y="167" width="140" height="8" rx="4" fill="#1e293b" />
    <rect x="14" y="167" width="65" height="8" rx="4" fill="#a855f7" />
  </g>

  <!-- Bottom Badges / Tech stack row -->
  <g transform="translate(245, 365)">
    <rect width="530" height="90" rx="8" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
    <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold">Pipeline Architecture &amp; Analytics Modules</text>

    <!-- Badges -->
    <rect x="16" y="42" width="96" height="24" rx="6" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" />
    <text x="64" y="58" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">EDA &amp; Cleaning</text>

    <rect x="120" y="42" width="98" height="24" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" />
    <text x="169" y="58" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">Ridge Regression</text>

    <rect x="226" y="42" width="104" height="24" rx="6" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" />
    <text x="278" y="58" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">XGBoost Regressor</text>

    <rect x="338" y="42" width="106" height="24" rx="6" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)" />
    <text x="391" y="58" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">Confusion Matrix</text>

    <rect x="452" y="42" width="68" height="24" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" />
    <text x="486" y="58" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">Streamlit</text>
  </g>
</svg>
